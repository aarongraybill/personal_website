project:
  type: website
  render:
    - "*.qmd"
  pre-render:
    - bash scripts/build-font-assets.sh
    - bash build-cv.sh
  resources:
    - Graybill_CV.pdf
    - plausible_exclude.html
    - assets/email-obfuscation.js
    - assets/lastfm-widget.js
    - assets/uncook.js
    - assets/me-480.jpg
    - assets/me-480.webp
    - assets/me-800.jpg
    - assets/me-800.webp
    - assets/AtkinsonHyperlegibleNext-Variable.woff2
    - assets/AtkinsonHyperlegibleNext-VariableItalic.woff2
    - assets/AtkinsonHyperlegibleNext-OFL.txt

website:
  title: "Aaron Graybill"
  site-url: "https://www.aarongraybill.com"
  description: "Information and content from Aaron Graybill"
  navbar:
    pinned: true
    left:
    - href: index.qmd
      text: Home
    - href: Graybill_CV.pdf
      text: CV
  search: false
  favicon: favicon.ico
  image: assets/opengraph.png
  image-alt: "Aaron Graybill with an introduction over a blue and green batik-inspired redwood design."
  open-graph:
    image-width: 1200
    image-height: 630
  twitter-card:
    card-style: summary_large_image
    image-width: 1200
    image-height: 630
  plausible-analytics:
    path: _plausible_snippet.html

format:
  html:
    include-in-header:
      text: |
        <script src="/assets/uncook.js" defer></script>
        <script src="/assets/email-obfuscation.js" defer></script>
    highlight-style: a11y
    theme:
      light: 
        - flatly-modified.scss
        - custom.scss
