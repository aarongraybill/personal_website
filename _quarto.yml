project:
  type: website
  render:
    - "*.qmd"
  pre-render:
    - bash build-cv.sh
  resources:
    - Graybill_CV.pdf
    - assets/lastfm-widget.js
    - assets/uncook.js
    - assets/me-480.jpg
    - assets/me-480.webp
    - assets/me-800.jpg
    - assets/me-800.webp
    - assets/AtkinsonHyperlegibleNextVF-Variable.woff2

website:
  title: "Aaron Graybill"
  site-url: "https://www.aarongraybill.com"
  description: "Information and content from Aaron Graybill"
  navbar:
    pinned: true
    left:
    - href: index.qmd
      text: Home
    - href: Graybill_CV.pdf
      text: CV
  search: false
  favicon: favicon.ico
  image: assets/opengraph.png
  image-alt: "Aaron Graybill with an introduction over a blue and green batik-inspired redwood design."
  open-graph:
    image-width: 1200
    image-height: 630
  twitter-card:
    card-style: summary_large_image
    image-width: 1200
    image-height: 630

format:
  html:
    highlight-style: a11y
    theme:
      light: 
        - flatly-modified.scss
        - custom.scss
